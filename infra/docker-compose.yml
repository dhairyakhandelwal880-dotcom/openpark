services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: openpark
      POSTGRES_PASSWORD: openpark
      POSTGRES_DB: openpark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpark -d openpark"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional official Traccar server (https://www.traccar.org/)
  traccar:
    image: traccar/traccar:latest
    restart: unless-stopped
    ports:
      - "8082:8082"  # Traccar Web Dashboard
      - "5055:5055"  # Traccar Client (OsmAnd) protocol
    volumes:
      - traccardata:/opt/traccar/data
    profiles:
      - traccar-server

volumes:
  pgdata:
  traccardata:
