<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OpenPark - Operator Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px; /* Mobile first layout for attendants */
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Card */
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      background: #2563eb;
      color: white;
      font-weight: 800;
      font-size: 16px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }

    .brand-subtitle {
      font-size: 12px;
      color: #64748b;
    }

    .key-btn {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
    }

    /* Selector */
    .field-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 6px;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      font-size: 15px;
      background: #ffffff;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: #2563eb;
    }

    /* Live Status Hero */
    .status-hero {
      background: #f8fafc;
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
      position: relative;
    }

    .free-count {
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      color: #16a34a;
      margin-bottom: 6px;
      letter-spacing: -2px;
    }

    .free-label {
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hero-meta {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
      align-items: center;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      color: white;
    }

    .status-available { background-color: #16a34a; }
    .status-filling_up { background-color: #d97706; }
    .status-full { background-color: #dc2626; }
    .status-unknown { background-color: #64748b; }

    /* Touch Controls */
    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .btn-big {
      border: none;
      border-radius: 16px;
      padding: 20px 10px;
      font-size: 28px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      transition: transform 0.1s, opacity 0.1s;
      user-select: none;
    }

    .btn-big:active {
      transform: scale(0.97);
    }

    .btn-minus {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-plus {
      background: #dcfce7;
      color: #15803d;
    }

    .btn-subtext {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Secondary Controls */
    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn-action {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .btn-action.btn-full {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #991b1b;
    }

    /* Lot Edit Collapsible Section */
    .edit-section {
      border-top: 1px solid #e2e8f0;
      padding-top: 16px;
      margin-top: 8px;
    }

    .toggle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
    }

    .edit-form {
      display: none;
      margin-top: 14px;
    }

    .btn-save {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-save:hover {
      background: #1d4ed8;
    }

    /* Recent Reports List */
    .reports-card {
      margin-top: 4px;
    }

    .report-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
    }

    .report-badge {
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .badge-got_spot { background: #e0f2fe; color: #0369a1; }
    .badge-has_space { background: #dcfce7; color: #15803d; }
    .badge-lot_full { background: #fee2e2; color: #b91c1c; }

    /* API Key Modal / Dialog */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <header>
        <div class="brand">
          <div class="logo-badge">OP</div>
          <div>
            <div class="brand-title">Operator Dashboard</div>
            <div class="brand-subtitle">OpenPark City Network</div>
          </div>
        </div>
        <button id="btnApiKey" class="key-btn">🔑 Key</button>
      </header>

      <!-- Lot Selector -->
      <div class="field-group">
        <label for="lotSelector">Select Your Parking Lot</label>
        <select id="lotSelector"></select>
      </div>

      <!-- Free Spots Counter Display -->
      <div class="status-hero">
        <div id="freeSpotsDisplay" class="free-count">-</div>
        <div class="free-label">Free Spots Remaining</div>
        
        <div class="hero-meta">
          <div id="statusBadge" class="badge-status status-available">Available</div>
          <div id="capacityLabel" style="font-size: 12px; color: #64748b; font-weight: 600;">of 120 spots</div>
        </div>
      </div>

      <!-- Quick Counter Buttons (Step 12) -->
      <div class="button-grid">
        <button id="btnMinus" class="btn-big btn-minus">
          <span>−1</span>
          <span class="btn-subtext">CAR ENTERED</span>
        </button>
        <button id="btnPlus" class="btn-big btn-plus">
          <span>+1</span>
          <span class="btn-subtext">CAR EXITED</span>
        </button>
      </div>

      <div class="actions-row">
        <button id="btnMinus5" class="btn-action">−5 Cars</button>
        <button id="btnPlus5" class="btn-action">+5 Cars</button>
        <button id="btnFull" class="btn-action btn-full">Mark FULL</button>
      </div>

      <!-- Edit Lot Info Form -->
      <div class="edit-section">
        <div id="toggleEdit" class="toggle-header">
          <span>✏️ Edit Lot Details</span>
          <span id="editArrow">▼</span>
        </div>
        <form id="lotEditForm" class="edit-form">
          <div class="field-group" style="margin-top: 10px;">
            <label>Lot Name</label>
            <input type="text" id="editName" required />
          </div>
          <div class="field-group">
            <label>Total Capacity</label>
            <input type="number" id="editCapacity" min="1" required />
          </div>
          <div class="field-group">
            <label>Price Note</label>
            <input type="text" id="editPrice" placeholder="e.g. ₹30/hr" />
          </div>
          <button type="submit" class="btn-save">Save Lot Details</button>
        </form>
      </div>
    </div>

    <!-- Recent Activity / Crowdsourced Reports Card -->
    <div class="card reports-card">
      <div style="font-size: 14px; font-weight: 700; color: #334155; margin-bottom: 10px;">
        📢 Recent Driver Reports
      </div>
      <div id="reportsList">
        <div style="color: #94a3b8; font-size: 13px; text-align: center; padding: 12px 0;">
          No reports yet for this lot.
        </div>
      </div>
    </div>
  </div>

  <!-- API Key Modal -->
  <div id="apiModal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="margin-bottom: 8px;">Operator API Key</h3>
      <p style="font-size: 13px; color: #64748b; margin-bottom: 14px;">
        Used to authenticate availability updates with the OpenPark backend.
      </p>
      <input type="text" id="apiKeyInput" value="dev-key" style="margin-bottom: 14px;" />
      <div style="display: flex; gap: 8px;">
        <button id="btnSaveKey" class="btn-save" style="margin: 0;">Save Key</button>
        <button id="btnCloseKey" class="btn-action" style="flex: 1;">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";
    let apiKey = localStorage.getItem("openpark_api_key") || "dev-key";
    let allLots = [];
    let currentLot = null;
    let currentFreeSpots = 0;

    async function init() {
      await loadLots();
      setupEventListeners();
    }

    async function loadLots() {
      try {
        const res = await fetch(`${API_BASE}/lots`);
        allLots = await res.json();
        const selector = document.getElementById("lotSelector");
        selector.innerHTML = "";

        allLots.forEach(lot => {
          const opt = document.createElement("option");
          opt.value = lot.id;
          opt.innerText = `${lot.name} (${lot.city})`;
          selector.appendChild(opt);
        });

        if (allLots.length > 0) {
          selectLot(allLots[0].id);
        }
      } catch (e) {
        console.error("Failed to load lots:", e);
        alert("Failed to connect to backend API at " + API_BASE);
      }
    }

    async function selectLot(lotId) {
      try {
        const res = await fetch(`${API_BASE}/lots/${lotId}`);
        currentLot = await res.json();
        currentFreeSpots = currentLot.free_spots !== null ? currentLot.free_spots : currentLot.capacity;
        updateUI();
      } catch (e) {
        console.error("Error fetching lot details:", e);
      }
    }

    function updateUI() {
      if (!currentLot) return;
      
      const freeEl = document.getElementById("freeSpotsDisplay");
      freeEl.innerText = currentFreeSpots;

      const badge = document.getElementById("statusBadge");
      badge.className = `badge-status status-${currentLot.status}`;
      badge.innerText = currentLot.status.replace("_", " ").toUpperCase();

      if (currentLot.status === "full") {
        freeEl.style.color = "#dc2626";
      } else if (currentLot.status === "filling_up") {
        freeEl.style.color = "#d97706";
      } else {
        freeEl.style.color = "#16a34a";
      }

      document.getElementById("capacityLabel").innerText = `of ${currentLot.capacity} spots`;

      // Fill edit form
      document.getElementById("editName").value = currentLot.name;
      document.getElementById("editCapacity").value = currentLot.capacity;
      document.getElementById("editPrice").value = currentLot.price_note || "";

      // Render reports
      const reportsContainer = document.getElementById("reportsList");
      if (currentLot.recent_reports && currentLot.recent_reports.length > 0) {
        reportsContainer.innerHTML = currentLot.recent_reports.map(r => `
          <div class="report-item">
            <span class="report-badge badge-${r.kind}">${formatReportKind(r.kind)}</span>
            <span style="color: #94a3b8; font-size: 12px;">${r.time}</span>
          </div>
        `).join("");
      } else {
        reportsContainer.innerHTML = `<div style="color: #94a3b8; font-size: 13px; text-align: center; padding: 12px 0;">No reports yet for this lot.</div>`;
      }
    }

    function formatReportKind(kind) {
      if (kind === "got_spot") return "🅿️ Got a Spot";
      if (kind === "has_space") return "🟢 Has Space";
      if (kind === "lot_full") return "🔴 Lot was Full";
      return kind;
    }

    async function sendAvailabilityUpdate(newSpots) {
      if (!currentLot) return;
      const capacity = currentLot.capacity || 50;
      const validatedSpots = Math.max(0, Math.min(capacity, newSpots));

      try {
        const res = await fetch(`${API_BASE}/lots/${currentLot.id}/availability`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey
          },
          body: JSON.stringify({
            free_spots: validatedSpots,
            source: "operator"
          })
        });

        if (res.ok) {
          const data = await res.json();
          currentFreeSpots = data.free_spots;
          currentLot.status = data.status_label;
          updateUI();
        } else {
          const err = await res.json();
          alert(`Update failed (${res.status}): ${err.detail || 'Check API Key'}`);
        }
      } catch (e) {
        alert("Failed to send update. Backend may be offline.");
      }
    }

    async function saveLotDetails(e) {
      e.preventDefault();
      if (!currentLot) return;

      const updatedName = document.getElementById("editName").value;
      const updatedCap = parseInt(document.getElementById("editCapacity").value);
      const updatedPrice = document.getElementById("editPrice").value;

      try {
        const res = await fetch(`${API_BASE}/lots/${currentLot.id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey
          },
          body: JSON.stringify({
            name: updatedName,
            capacity: updatedCap,
            price_note: updatedPrice
          })
        });

        if (res.ok) {
          alert("Lot details updated successfully!");
          selectLot(currentLot.id);
        } else {
          alert("Failed to update lot details.");
        }
      } catch (err) {
        alert("Error saving details.");
      }
    }

    function setupEventListeners() {
      document.getElementById("lotSelector").addEventListener("change", (e) => {
        selectLot(e.target.value);
      });

      document.getElementById("btnPlus").addEventListener("click", () => {
        sendAvailabilityUpdate(currentFreeSpots + 1);
      });

      document.getElementById("btnMinus").addEventListener("click", () => {
        sendAvailabilityUpdate(currentFreeSpots - 1);
      });

      document.getElementById("btnPlus5").addEventListener("click", () => {
        sendAvailabilityUpdate(currentFreeSpots + 5);
      });

      document.getElementById("btnMinus5").addEventListener("click", () => {
        sendAvailabilityUpdate(currentFreeSpots - 5);
      });

      document.getElementById("btnFull").addEventListener("click", () => {
        sendAvailabilityUpdate(0);
      });

      document.getElementById("lotEditForm").addEventListener("submit", saveLotDetails);

      // Collapsible form toggle
      document.getElementById("toggleEdit").addEventListener("click", () => {
        const form = document.getElementById("lotEditForm");
        const arrow = document.getElementById("editArrow");
        const isHidden = form.style.display === "none" || form.style.display === "";
        form.style.display = isHidden ? "block" : "none";
        arrow.innerText = isHidden ? "▲" : "▼";
      });

      // API Key Modal
      const modal = document.getElementById("apiModal");
      document.getElementById("btnApiKey").addEventListener("click", () => {
        document.getElementById("apiKeyInput").value = apiKey;
        modal.style.display = "flex";
      });

      document.getElementById("btnCloseKey").addEventListener("click", () => {
        modal.style.display = "none";
      });

      document.getElementById("btnSaveKey").addEventListener("click", () => {
        apiKey = document.getElementById("apiKeyInput").value.trim();
        localStorage.setItem("openpark_api_key", apiKey);
        modal.style.display = "none";
        alert("API Key saved.");
      });
    }

    window.onload = init;
  </script>
</body>
</html>
